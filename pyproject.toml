[project]
name = "company-brain"
version = "0.1.0"
description = "Hybrid RAG + knowledge graph 'company brain' over internal documents, demonstrated on a logistics/freight knowledge base."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Matteo Bigi" }]
license = { text = "MIT" }

dependencies = [
  "sentence-transformers>=3.0",
  "torch>=2.2",
  "bm25s>=0.2",
  "networkx>=3.3",
  "numpy>=1.26",
  "typer>=0.12",
  "rich>=13.7",
  "anthropic>=0.40",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
company-brain = "company_brain.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/company_brain"]

[tool.pytest.ini_options]
pythonpath = ["src"]
